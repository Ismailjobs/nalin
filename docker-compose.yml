# Veriler 3001 (client) ve 4001 (API) üzerinden girer/çıkar. Sunucuda .env ile HOST URL'lerini ayarlayın.
version: "3.8"

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nalin-server
    ports:
      - "4001:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/nalin}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - CONTACT_EMAIL=${CONTACT_EMAIL:-office@nalin.at}
      - HCAPTCHA_SECRET=${HCAPTCHA_SECRET}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-https://nalin.at}
    depends_on:
      - mongo
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://nalin.at}
        NEXT_PUBLIC_HCAPTCHA_SITEKEY: ${NEXT_PUBLIC_HCAPTCHA_SITEKEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://nalin.at}
    container_name: nalin-client
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
    depends_on:
      - server
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: nalin-mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
